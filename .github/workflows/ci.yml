name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t lab12app .

      - name: Run Container Test
        run: |
          docker run -d -p 3000:3000 --name testapp lab12app
          sleep 5
          docker ps
          docker stop testapp
