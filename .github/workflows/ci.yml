name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ghcr.io/areeba-anjum98/lab12app:latest .

      - name: Push to GitHub Container Registry
        run: docker push ghcr.io/areeba-anjum98/lab12app:latest

      - name: Run Container Test
        run: |
          docker run -d -p 3000:3000 --name testapp ghcr.io/areeba-anjum98/lab12app:latest
          sleep 5
          docker ps
          docker stop testapp
