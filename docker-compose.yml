services:
  web:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - database
      - cache
    networks:
      - frontend
      - backend

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password123
      POSTGRES_USER: labuser
      POSTGRES_DB: labdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "labuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:alpine
    networks:
      - backend

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - frontend

volumes:
  pgdata:

networks:
  frontend:
  backend:
